# 1Panel 静态网站配置
# 将 dist/ 内的构建产物上传到 /www/sites/astro-koharu/index/

server {
    listen 5173;
    server_name 8.148.179.96;

    root /www/sites/astro-koharu/index;
    index index.html;

    access_log /www/sites/astro-koharu/log/access.log main;
    error_log /www/sites/astro-koharu/log/error.log;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite/Vue Router history mode. Keep hashed assets as real files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The frontend calls these same-origin paths. The trailing slash in
    # proxy_pass removes /bili/ or /uapi/ before sending the request upstream.
    location ^~ /bili/ {
        proxy_pass https://api.bilibili.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name api.bilibili.com;
        proxy_http_version 1.1;
        proxy_set_header Host api.bilibili.com;
        proxy_set_header Origin "";
        proxy_set_header Referer https://www.bilibili.com/;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 30s;
    }

    location ^~ /uapi/ {
        proxy_pass https://uapis.cn/;
        proxy_ssl_server_name on;
        proxy_ssl_name uapis.cn;
        proxy_http_version 1.1;
        proxy_set_header Host uapis.cn;
        proxy_set_header Origin "";
        proxy_set_header Referer https://uapis.cn/;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 30s;
    }
}
